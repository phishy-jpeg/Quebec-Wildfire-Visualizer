<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fire History Graphs | Quebec Wildfire Visualizer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/graphs.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script type="module" src="js/graphs.js"></script>
</head>
<body>
    <header class="site-header">
        <h1 class="header-title">Quebec Wildfire Visualizer</h1>
        <nav class="site-nav">
            <a href="index.html#map-section">Map</a>
            <a href="graphs.html" aria-current="page">Graphs</a>
            <a href="data.html">Data</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="graph-page">
        <h2>Wildfires by year</h2>
        <p class="graph-description">The graph and year selection follow the years selected on the map.</p>

        <div class="graph-layout">
            <section class="year-filter" aria-labelledby="year-filter-title">
                <h3 id="year-filter-title">Filter by year</h3>
                <div class="year-range-filter">
                    <label for="year-filter-input-from">From</label>
                    <input type="number" id="year-filter-input-from" class="year-filter-input" placeholder="From year">
                    <label for="year-filter-input-to">To</label>
                    <input type="number" id="year-filter-input-to" class="year-filter-input" placeholder="To year">
                    <button id="apply-year-range" type="button">Apply range</button>
                    <p id="year-filter-status" role="status" aria-live="polite"></p>
                </div>
                <label class="year-search-label" for="year-search">Find a year</label>
                <input id="year-search" class="year-search" type="search" inputmode="numeric" placeholder="Search years">
                <p id="year-selection-count" class="year-selection-count" aria-live="polite"></p>
                <ul id="year-options" class="year-options" aria-label="Select years to display"></ul>
                <button id="clear-year-selection" type="button">Clear selection</button>
                <button id="clear-year-filter" type="button">Show all years</button>
                <div class="fire-statistics">
                    <p>Total fires: <output id="fire-count-value"></output></p>
                    <p>Total hectares burned: <output id="hectares-count-value"></output></p>
                </div>
            </section>

            <section class="chart-panel" aria-label="Wildfire counts and burned area by year">
                <div class="chart-container">
                    <canvas id="fire-graph" role="img" aria-label="Bar chart of recorded fires and hectares burned by year"></canvas>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
