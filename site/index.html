<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quebec Historic Wildfire Visualizer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Import for maplibre style -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- PMTiles protocol handler -->
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
    <!-- Import for my own js -->
    <script type="module" src="js/index.js"></script>
</head>
<body class="map-page">
    <!------------------- Header ----------------->
    <header class="site-header">
        <h1 class="header-title">Quebec Wildfire Visualizer</h1>
        <nav class="site-nav">
            <a href="index.html">Map</a>
            <a href="graphs.html">Graphs</a>
            <a href="data.html">Data</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="map-layout">
        <div id="map">
                <div id="fire-data-status" class="fire-data-status" role="status" aria-live="polite">
                    Loading wildfire data…
                </div>
                <!---------------- FILTERS SECTION ------------------->
                <div id="map-filters" class="map-filter">
                    <div id="toggle-header" class="toggler-header">
                        <h1 id="filter-header-h1" class="filter-header-h1" aria-controls="filter-panel" aria-expanded="false" hidden> Filters</h1>
                        <button id="filter-toggle" class="filter-toggle" type="button" aria-label="Toggle filters" aria-expanded="false" aria-controls="filter-panel">
                            <div class="bar1"></div>
                            <div class="bar2"></div>
                            <div class="bar3"></div>
                        </button>
                    </div>
                    <div id="filter-panel" class="filter-panel" hidden>
                        <div id="year-filter-section" class="filter-section">
                            <button id="year-filter-toggle" class="panel-item" type="button" aria-expanded="false" aria-controls="year-panel">
                                <span>Filter by year ⬇</span>
                            </button>
                            <div id="year-panel" class="filter-panel-item" aria-controls="filter-panel" aria-expanded="false"  hidden>
                                <div class="year-range-filter">
                                    <label for="year-filter-input-from">View years from</label>
                                    <input type="number" id="year-filter-input-from" class="year-filter-input" placeholder="From year"/>
                                    <label for="year-filter-input-to">to</label>
                                    <input type="number" id="year-filter-input-to" class="year-filter-input" placeholder="To year"/>
                                    <button id="add-year-range" class="button-secondary" type="button">Add to selection</button>
                                    <button id="new-year-selection" class="button-secondary" type="button">New selection</button>
                                    <p id="year-filter-status" role="status" aria-live="polite"></p>
                                </div>
                                <p id="years-shown" class="years-shown" aria-live="polite"></p>
                                <p id="year-selection-count" class="year-selection-count" aria-live="polite"></p>
                                <ul id="year-options" class="year-options"></ul>
                                <button id="clear-year-selection" class="button-secondary" type="button">Clear selection</button>
                                <button id="clear-year-filter" class="button-secondary" type="button">Show all years</button>
                                <div class="fire-statistics">
                                    <!--- TODO: why do I even have this in the html???? Make it purely a js function -->
                                    <aside class="fire-count-box">
                                        <span class="fire-count-title">Total fires</span>
                                        <output id="fire-count-value">113,032</output>
                                        <span class="fire-count-footer">Across selected years</span>
                                    </aside>
                                    <aside class="hectares-count-box">
                                        <span class="fire-count-title">Total hectares burned</span>
                                        <output id="hectares-count-value">30,407,601.3</output>
                                        <span class="fire-count-footer">Across selected years</span>
                                    </aside>
                                </div>                                
                            </div>
                        </div>
                        <div class="size-filter-section">
                            <button id="size-filter-toggle" class="panel-item" type="button" aria-expanded="false" aria-controls="size-panel">
                                <span>Filter by size ⬇</span>
                            </button>
                            <div id="size-panel" class="size-panel" hidden>
                                <p class="map-hint">Size filters will be available here.</p>
                            </div>
                        </div>
                        <div class="layers-filter-section">
                            <button id="layers-filter-toggle" class="panel-item" type="button" aria-expanded="false" aria-controls="layers-panel">
                                <span>Layers ⬇</span>
                            </button>
                            <div id="layers-panel" class="layers-panel" hidden>
                                <label class="layer-option" for="watersheds-toggle">
                                    <input id="watersheds-toggle" type="checkbox" checked>
                                    <span class="layer-legend-swatch" aria-hidden="true"></span>
                                    <span>Watersheds</span>
                                </label>
                                <label class="layer-option" for="quebec-border-toggle">
                                    <input id="quebec-border-toggle" type="checkbox" checked>
                                    <span class="layer-legend-swatch layer-legend-swatch-border" aria-hidden="true"></span>
                                    <span>Quebec Border</span>
                                </label>
                            </div>
                        </div>                        
                    </div>
                </div>
        </div>
    </main>
</body>
</html>
